[package]
name = "rhp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-test = "21.0.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenv = "0.15.0"
logos = "0.16.1"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "sqlite"]}
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
